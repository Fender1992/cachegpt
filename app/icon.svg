<svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ede9fe" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Outer arcs -->
    <path d="M 50,-145 A 150,150 0 0,1 130,75" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.09" stroke-linecap="round"/>
    <path d="M -130,-70 A 150,150 0 0,0 -40,145" fill="none" stroke="white" stroke-width="1.8" stroke-opacity="0.07" stroke-linecap="round"/>
    <!-- Mid ring -->
    <path d="M 0,-105 A 105,105 0 0,1 91,52" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M -60,87 A 105,105 0 0,1 -105,0" fill="none" stroke="white" stroke-width="2.8" stroke-opacity="0.15" stroke-linecap="round"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.28" stroke-dasharray="30 8"/>
    <!-- Particles -->
    <circle cx="0" cy="-105" r="3.5" fill="white" opacity="0.4"/>
    <circle cx="72" cy="0" r="3" fill="white" opacity="0.35"/>
    <circle cx="-50" cy="50" r="2.5" fill="white" opacity="0.25"/>
    <!-- Core -->
    <circle cx="0" cy="0" r="45" fill="url(#core)"/>
    <circle cx="0" cy="0" r="28" fill="white" opacity="0.95"/>
    <!-- Diamond cache symbol -->
    <g transform="rotate(45)">
      <rect x="-10" y="-10" width="20" height="20" rx="2.5" fill="url(#bg)" opacity="0.75"/>
    </g>
  </g>
</svg>
